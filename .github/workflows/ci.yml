name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same branch cancels the previous run instead of queueing behind it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          # The cache is keyed on the lockfile. Without this the action looks for
          # uv.lock at the repository root and fails, since ours lives in backend/.
          cache-dependency-glob: backend/uv.lock

      # sync installs exactly what uv.lock pins, so CI and a developer machine
      # resolve to the same versions. "uv pip install" would re-resolve each run
      # and could pick up a new transitive release mid-pull-request.
      - name: Install dependencies
        run: uv sync --extra dev --frozen

      - name: Lint
        run: .venv/bin/ruff check .

      - name: Format
        run: .venv/bin/ruff format --check .

      - name: Typecheck
        run: .venv/bin/mypy app

      # No database service: these tests call the app in-process and never open a
      # socket. Postgres joins this job in Phase 2, when there is a schema to test.
      - name: Test
        run: .venv/bin/pytest -q --cov=app --cov-report=term-missing

      # Advisories change without the code changing, so this runs on every build
      # rather than only when a dependency is edited.
      - name: Audit dependencies
        # --skip-editable: this project itself is installed editable and is not on
        # PyPI, so auditing it is neither possible nor meaningful.
        run: uv pip install pip-audit && .venv/bin/pip-audit --skip-editable

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Fails the build on critical only. Two high advisories are currently open
      # against transitive dependencies of Next: sharp/libvips (image processing)
      # and postcss sourceMappingURL (build-time CSS). This app serves no images
      # through next/image and processes only its own stylesheet, so neither is
      # reachable at runtime. Both clear on the Next 16 upgrade, which also drops
      # `next lint` and needs an ESLint 9 flat config migration. Reassess when
      # that work is scheduled rather than taking it for an unreachable finding.
      - name: Audit dependencies
        run: npm audit --omit=dev --audit-level=critical

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
